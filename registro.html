
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Catástrofes - Crear cuenta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="login-card">
        <h2>Crear Cuenta</h2>
        <p class="subtitulo">Sistema de Reporte de Catástrofes Colombia</p>

        <form id="form-registro">
            <div class="campo">
                <label for="nombres">Nombre(s)</label>
                <input type="text" id="nombres" placeholder="Tu nombre" required>
            </div>

            <div class="campo">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Tus apellidos" required>
            </div>

            <div class="campo">
                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha_nacimiento" required>
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <p id="mensaje" class="mensaje"></p>

            <button type="submit">Crear cuenta</button>
        </form>

        <p class="enlace-secundario">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    </div>

    <script type="module" src="js/registro.js"></script>
</body>
</html>
